<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MyFace AI logo</title>
  <desc>A rose-pink rounded square icon with a minimal face silhouette framed by four scan corner brackets and a horizontal scan line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9607A"/>
      <stop offset="1" stop-color="#A0304A"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAEAED"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M46 62 V50 a8 8 0 0 1 8-8 H66"/>
    <path d="M134 42 H146 a8 8 0 0 1 8 8 V62"/>
    <path d="M154 138 V150 a8 8 0 0 1-8 8 H134"/>
    <path d="M66 158 H54 a8 8 0 0 1-8-8 V138"/>
  </g>

  <path d="M100 54
           C 122 54 132 72 132 94
           C 132 112 126 124 116 132
           L116 150
           C 116 160 110 166 100 166
           C 90 166 84 160 84 150
           L84 132
           C 74 124 68 112 68 94
           C 68 72 78 54 100 54 Z"
        fill="url(#face)"/>

  <rect x="70" y="102" width="60" height="4" rx="2" fill="#C0405A" opacity="0.85"/>
  <circle cx="130" cy="104" r="4.5" fill="#C0405A"/>
</svg>
